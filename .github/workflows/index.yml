name: Index

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: true

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild index and check entries
        run: |
          python3 scripts/journal.py index
          {
            echo "## Journal check"
            echo '```'
            python3 scripts/journal.py check
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "journal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "Update journal index" && git push)
