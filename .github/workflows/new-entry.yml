name: New entry

on:
  schedule:
    # Tue and Thu, 9:13 PM Pacific (05:13 UTC Wed and Fri during PST)
    - cron: "13 5 * * 3,5"
  workflow_dispatch:
    inputs:
      date:
        description: "Entry date YYYY-MM-DD (blank = today, Pacific)"
        required: false
      title:
        description: "Title (blank = Week N Electronics/Fabrication)"
        required: false
      type:
        description: "Type override: electronics, fabrication, project or analysis"
        required: false

permissions:
  contents: write

jobs:
  new-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create entry
        env:
          IN_DATE: ${{ inputs.date }}
          IN_TITLE: ${{ inputs.title }}
          IN_TYPE: ${{ inputs.type }}
        run: |
          args=()
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # Scheduled runs can start hours late, so step back to the latest class day
            args+=(--catch-up)
          fi
          [ -n "$IN_DATE" ] && args+=(--date "$IN_DATE")
          [ -n "$IN_TITLE" ] && args+=(--title "$IN_TITLE")
          [ -n "$IN_TYPE" ] && args+=(--type "$IN_TYPE" --force)
          python3 scripts/journal.py new "${args[@]}"
          python3 scripts/journal.py index
      - name: Commit
        run: |
          git config user.name "journal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "New journal entry" && git push)
