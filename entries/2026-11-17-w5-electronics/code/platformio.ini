; Adafruit ESP32 Feather V2 (ESP32-PICO-V3-02, 8 MB flash, 2 MB PSRAM)
; If PlatformIO says "Unknown board ID", run: pio platform update espressif32
[platformio]
default_envs = feather_v2

[env:feather_v2]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = arduino
monitor_speed = 115200
; The default partition table gives the app only 1.25 MB of the 8 MB flash. This one gives 3.2 MB.
board_build.partitions = default_8MB.csv
lib_deps =
    adafruit/Adafruit NeoPixel
    bblanchon/ArduinoJson
build_src_filter = +<*> -<pintest/> -<wifiscan/>

; Solder joint tester for the header pins: pio run -e pintest -t upload
[env:pintest]
extends = env:feather_v2
build_src_filter = +<pintest/>

; Wi-Fi diagnostic for the second network: pio run -e wifiscan -t upload
[env:wifiscan]
extends = env:feather_v2
build_src_filter = +<wifiscan/>
